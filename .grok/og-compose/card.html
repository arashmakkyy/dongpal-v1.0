<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("./Vazirmatn-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
    @font-face {
      font-family: Vazirmatn;
      src: url("./Vazirmatn-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1792px;
      height: 1008px;
      overflow: hidden;
      background: #F4F6FA;
    }
    .card {
      width: 1792px;
      height: 1008px;
      position: relative;
      background: url("./bg.jpg") center / cover no-repeat;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(244, 246, 250, 0.94);
      border: 4px solid #0E9F86;
      border-radius: 40px;
      padding: 28px 80px 34px;
      box-shadow:
        0 18px 50px rgba(26, 35, 64, 0.18),
        0 0 0 10px rgba(244, 246, 250, 0.35);
      min-width: 920px;
      max-width: 1180px;
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 10px;
      display: block;
    }
    .title {
      font-family: Vazirmatn, sans-serif;
      font-weight: 800;
      font-size: 132px;
      line-height: 1.15;
      color: #1A2340;
      letter-spacing: 0;
    }
    .tag {
      font-family: Vazirmatn, sans-serif;
      font-weight: 500;
      font-size: 38px;
      line-height: 1.4;
      color: #0E9F86;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="8" y="6" width="48" height="52" rx="10" fill="#0E9F86"/>
        <rect x="16" y="16" width="32" height="5" rx="2.5" fill="#F4F6FA"/>
        <rect x="16" y="26" width="22" height="5" rx="2.5" fill="#F4F6FA"/>
        <rect x="16" y="36" width="28" height="5" rx="2.5" fill="#F4F6FA"/>
        <circle cx="44" cy="46" r="12" fill="#7B67F6"/>
        <path d="M44 40 v12 M38 46 h12" stroke="#F4F6FA" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <h1 class="title">دنگ‌پال</h1>
      <p class="tag">خرج‌ها رو گروهی مدیریت کن</p>
    </div>
  </div>
</body>
</html>
